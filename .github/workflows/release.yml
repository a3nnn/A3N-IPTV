name: Build Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Version from tag
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || V="0.0.0"
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"

      - name: Build app
        shell: cmd
        run: |
          copy /Y assets\app_icon.ico windows\runner\resources\app_icon.ico
          flutter pub get
          flutter build windows --release --build-name=%APP_VERSION%

      - name: Add Visual C++ runtime
        shell: cmd
        run: |
          for %%F in (msvcp140.dll vcruntime140.dll vcruntime140_1.dll) do copy /Y "%SystemRoot%\System32\%%F" build\windows\x64\runner\Release\

      # ---- SignPath: sign the app files here once the project is approved ----

      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:APP_VERSION" installer.iss

      # ---- SignPath: sign installer\A3N_IPTV_Player_Setup.exe here once approved ----

      - uses: actions/upload-artifact@v4
        with:
          name: A3N_IPTV_Player_Setup
          path: installer/A3N_IPTV_Player_Setup.exe

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: A3N IPTV Player ${{ env.APP_VERSION }}
          files: installer/A3N_IPTV_Player_Setup.exe
