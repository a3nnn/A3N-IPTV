name: Build Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Version from tag
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || V="0.0.0"
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"

      - name: Decrypt font
        shell: bash
        env:
          FONT_KEY: ${{ secrets.FONT_KEY }}
        run: |
          if [ -z "$FONT_KEY" ]; then
            echo "::error::Add the FONT_KEY secret first."
            exit 1
          fi
          for f in assets/fonts/*.otf.enc; do
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -in "$f" -out "${f%.enc}" -pass env:FONT_KEY
          done
          ls -la assets/fonts

      - name: Build app
        shell: pwsh
        run: |
          Copy-Item assets\app_icon.ico windows\runner\resources\app_icon.ico -Force
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit 1 }
          flutter build windows --release --build-name=$env:APP_VERSION
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Add Visual C++ runtime
        shell: pwsh
        run: |
          foreach ($f in 'msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') {
            Copy-Item "$env:SystemRoot\System32\$f" build\windows\x64\runner\Release\ -Force
          }

      # ---- SignPath: sign the app files here once the project is approved ----

      - name: Build installer
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:APP_VERSION" installer.iss

      # ---- SignPath: sign installer\A3N_IPTV_Player_Setup.exe here once approved ----

      - uses: actions/upload-artifact@v4
        with:
          name: A3N_IPTV_Player_Setup
          path: installer/A3N_IPTV_Player_Setup.exe

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: A3N IPTV Player ${{ env.APP_VERSION }}
          files: installer/A3N_IPTV_Player_Setup.exe
